# CI for APMKit Android SDK.
#
# `02` §5 requires the performance budget to be measured automatically, not checked by hand —
# so the budget runs here as a first-class job, not as an optional step someone remembers.
#
# This mirrors ./verify.sh exactly. The harness treats verify.sh's final line as the proof a
# feature is done; CI running anything different would mean two definitions of "green".
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build · test · lint · budget
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A step's own `env:` block is not visible to that step's `if:` — GitHub evaluates the condition
    # first — so a condition written against step-level env is always false and the step silently never
    # runs. For a release gate that is the worst possible bug: it looks configured and enforces nothing.
    # So the condition reads a job-level flag.
    #
    # The flag is deliberately NOT a secret: just "are both configured". The secrets themselves live only
    # in the env of the one step that uploads symbols. Putting them at job level would expose the CI token
    # to every step — including third-party actions (checkout, Java and Gradle setup) and anything a build
    # or test script prints.
    env:
      SYMBOLS_CONFIGURED: ${{ secrets.APM_SYMBOLS_URL != '' && secrets.APM_CI_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./verify.sh build

      - name: Unit tests
        run: ./verify.sh test

      - name: Lint
        run: ./verify.sh lint

      # `02` §5: "Dilanggar = tidak boleh rilis." Failing this job blocks the merge, which is the
      # only thing that makes a budget a budget rather than a note.
      - name: Performance budget
        run: ./verify.sh budget

      # A13/SEC-19: the publication is built and validated on every change, so a malformed POM or
      # a missing artifact fails here rather than during a release. No credentials involved — the
      # internal repository is only a destination.
      - name: Publication
        run: ./verify.sh publish

      # `01` §8 is a release gate: "pipeline CI harus **gagal** jika upload symbol gagal."
      #
      # Skipped only when the secrets are not configured yet, so forks and pull requests still
      # build. That exemption is itself announced by the step below — a gate that quietly does
      # nothing is indistinguishable from one that is working, which is the failure `01` §8 warns
      # about in the first place.
      - name: Symbol upload (release gate)
        if: github.event_name == 'push' && env.SYMBOLS_CONFIGURED == 'true'
        env:
          APM_SYMBOLS_URL: ${{ secrets.APM_SYMBOLS_URL }}
          APM_CI_TOKEN: ${{ secrets.APM_CI_TOKEN }}
        run: ./gradlew :app:uploadSymbols

      - name: Warn that the symbol gate is not configured
        if: github.event_name == 'push' && env.SYMBOLS_CONFIGURED != 'true'
        run: |
          echo "::warning title=Symbol upload not configured::\
          APM_SYMBOLS_URL / APM_CI_TOKEN are not set, so mapping.txt was not uploaded. \
          Crash reports from a release build of this app will be unreadable (01 section 8). \
          Add both as repository secrets to arm the gate."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: sdk/build/reports/tests/
          retention-days: 14
